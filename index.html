<style>
:root{
  --ink:#132A33;
  --ink-soft:#52707A;
  --paper:#F2F8F9;
  --paper-card:#FFFFFF;
  --kraft:#0E93A6;
  --kraft-dark:#0A6F80;
  --line:#D9E9EC;
  --brand-deep:#00879E;
  --brand-bright:#3FD2DC;
  --stamp-green:#178C74;
  --stamp-green-bg:#E1F3EE;
  --stamp-red:#C1502F;
  --stamp-red-bg:#FBEAE2;
  --shadow-card: 0 1px 0 rgba(19,42,51,0.05);
  --radius:10px;
  --font-display:'Space Grotesk', 'IBM Plex Sans Thai', sans-serif;
  --font-body:'IBM Plex Sans Thai', sans-serif;
  --font-mono:'IBM Plex Mono', 'IBM Plex Sans Thai', monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
.app{max-width:1040px;margin:0 auto;padding:20px 20px 60px;}

.masthead{
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px 24px;
  margin-bottom:18px;
  background:var(--paper-card);
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  overflow:hidden;
}
.masthead::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg, var(--brand-deep), var(--brand-bright));
}
.masthead-brand{display:flex;align-items:center;gap:16px;}
.masthead-brand img{height:76px;width:auto;display:block;}
.masthead h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:26px;
  letter-spacing:-0.2px;
  margin:0;
  line-height:1.15;
}
.masthead .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;font-family:var(--font-mono);letter-spacing:0.4px;}
.masthead .date-stamp{
  font-family:var(--font-mono);
  font-size:12px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--kraft-dark);
  padding:6px 12px;
  border-radius:6px;
}

.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{
  font-family:var(--font-body);
  font-weight:600;
  font-size:14px;
  padding:9px 16px;
  background:transparent;
  border:1.5px solid var(--ink);
  border-radius:4px 4px 0 0;
  cursor:pointer;
  color:var(--ink-soft);
}
.tab-btn.active{background:var(--ink);color:var(--paper-card);}

.panel{display:none;}
.panel.active{display:block;}

.card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 18px;
  box-shadow:var(--shadow-card);
}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.metric{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-left:4px solid var(--kraft);
  border-radius:var(--radius);
  padding:14px 16px;
}
.metric.warn{border-left-color:var(--stamp-red);}
.metric.good{border-left-color:var(--stamp-green);}
.metric .label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);font-family:var(--font-mono);}
.metric .value{font-family:var(--font-display);font-size:30px;letter-spacing:0.5px;margin-top:2px;}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
.section-head h2{font-family:var(--font-display);font-size:20px;letter-spacing:0.5px;margin:0;font-weight:400;}

button.primary{
  font-family:var(--font-body);font-weight:600;font-size:13.5px;
  background:var(--ink);color:var(--paper-card);border:none;
  padding:9px 16px;border-radius:6px;cursor:pointer;
}
button.primary:hover{background:#1a241f;}
button.ghost{
  font-family:var(--font-body);font-weight:600;font-size:13.5px;
  background:transparent;color:var(--ink);border:1.5px solid var(--ink);
  padding:8px 14px;border-radius:6px;cursor:pointer;
}
button.ghost:hover{background:var(--line);}
button.small{padding:5px 10px;font-size:12px;border-radius:5px;}
button.danger-outline{border-color:var(--stamp-red);color:var(--stamp-red);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);padding:8px 8px;border-bottom:1.5px solid var(--ink);}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.mono{font-family:var(--font-mono);}
.item-name{font-weight:600;}
.qty-low{color:var(--stamp-red);font-weight:700;}

.badge{
  display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:4px;letter-spacing:0.3px;
}
.badge.in{background:var(--stamp-green-bg);color:var(--stamp-green);}
.badge.out{background:var(--stamp-red-bg);color:var(--stamp-red);}
.badge.low{background:var(--stamp-red-bg);color:var(--stamp-red);}
.badge.ok{background:var(--stamp-green-bg);color:var(--stamp-green);}
.badge.grp{background:#EDE6D3;color:var(--kraft-dark);}
.badge.warr-active{background:var(--stamp-green-bg);color:var(--stamp-green);}
.badge.warr-soon{background:#F5E9D6;color:var(--kraft-dark);}
.badge.warr-expired{background:var(--stamp-red-bg);color:var(--stamp-red);}
.serial-tag{display:inline-block;font-family:var(--font-mono);font-size:12px;background:#EFEADC;color:var(--ink);padding:2px 7px;border-radius:4px;margin:0 4px 4px 0;}

.img-picker{display:flex;align-items:center;gap:12px;}
.img-preview{
  width:64px;height:64px;border-radius:8px;border:1.5px dashed var(--line);
  background:#fff;display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;font-size:10px;color:var(--ink-soft);text-align:center;
}
.img-preview img{width:100%;height:100%;object-fit:cover;display:block;}
.img-picker-actions{display:flex;gap:8px;flex-wrap:wrap;}
.thumb{
  width:56px;height:56px;border-radius:8px;object-fit:cover;
  border:1px solid var(--line);display:block;background:#fff;flex-shrink:0;
}
.thumb-empty{
  width:56px;height:56px;border-radius:8px;border:1px dashed var(--line);
  background:#fff;flex-shrink:0;
}
.item-cell{display:flex;align-items:center;gap:12px;}

.group-head{
  font-family:var(--font-display);font-size:17px;letter-spacing:0.5px;
  display:flex;align-items:center;gap:8px;margin:0 0 8px;color:var(--ink);
}
.group-head .count{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);font-weight:400;}
.group-block{margin-bottom:18px;}
.group-block:last-child{margin-bottom:0;}

.empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:14px;}
.empty .big{font-family:var(--font-display);font-size:22px;color:var(--ink);margin-bottom:4px;}

.modal-wrap{position:fixed;inset:0;background:rgba(38,51,44,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-wrap.open{display:flex;}
.modal{
  background:var(--paper-card);border:2px solid var(--ink);border-radius:8px;
  width:100%;max-width:420px;padding:20px;max-height:88vh;overflow-y:auto;
}
.modal h3{font-family:var(--font-display);font-size:22px;font-weight:400;margin:0 0 14px;letter-spacing:0.5px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;
  font-family:var(--font-body);font-size:14px;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--kraft);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.type-toggle{display:flex;gap:8px;margin-bottom:12px;}
.tx-line{border:1px solid var(--line);border-radius:8px;padding:12px;padding-right:60px;margin-bottom:10px;position:relative;background:var(--paper);}
.tx-line .tx-line-remove{position:absolute;top:10px;right:10px;}
.tx-line-num{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.type-toggle button{flex:1;padding:10px;border-radius:6px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-family:var(--font-body);cursor:pointer;color:var(--ink-soft);}
.type-toggle button.sel-in.selected{border-color:var(--stamp-green);background:var(--stamp-green-bg);color:var(--stamp-green);}
.type-toggle button.sel-out.selected{border-color:var(--stamp-red);background:var(--stamp-red-bg);color:var(--stamp-red);}

.report-box{
  border:1.5px dashed var(--kraft-dark);border-radius:8px;padding:16px;
  font-family:var(--font-mono);font-size:13px;white-space:pre-wrap;line-height:1.7;
  background:#fff;
}
.note{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:10px;}
.note b{color:var(--ink);}
.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper-card);padding:10px 18px;border-radius:6px;
  font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;
}
.toast.show{opacity:1;}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filters select,.filters input{padding:7px 9px;border:1.5px solid var(--line);border-radius:6px;font-family:var(--font-body);font-size:13px;background:#fff;}
.loading{padding:40px;text-align:center;color:var(--ink-soft);font-family:var(--font-mono);}
@media(max-width:600px){
  .masthead h1{font-size:26px;}
}
#printReport{ display:none; }
#printReport table{ width:100%; border-collapse:collapse; font-size:11px; margin-bottom:22px; }
#printReport th,#printReport td{ border:1px solid #999; padding:5px 7px; text-align:left; }
#printReport th{ background:#eef5f6; }
#printReport h1{ font-size:20px; margin:0 0 2px; font-family:var(--font-body); }
#printReport h2{ font-size:15px; border-bottom:2px solid #132A33; padding-bottom:4px; margin-top:24px; font-family:var(--font-body); font-weight:600; }
@media print{
  body *{ visibility:hidden; }
  #printReport, #printReport *{ visibility:visible; }
  #printReport{ display:block !important; position:absolute; top:0; left:0; width:100%; padding:16px; }
}
</style>
</head>
<body>
<div id="printReport"></div>
<div class="app" id="app">
  <div class="loading" id="loading">กำลังโหลดข้อมูล…</div>
</div>

<div class="modal-wrap" id="itemModalWrap">
  <div class="modal">
    <h3 id="itemModalTitle">เพิ่มสินค้าใหม่</h3>
    <input type="hidden" id="itemEditId">
    <div class="field">
      <label>รูปสินค้า (ไม่บังคับ)</label>
      <div class="img-picker">
        <div class="img-preview" id="fImagePreview">ไม่มีรูป</div>
        <div class="img-picker-actions">
          <button type="button" class="ghost small" onclick="document.getElementById('fImageFile').click()">เลือกรูป</button>
          <button type="button" class="ghost small danger-outline" id="fImageRemoveBtn" onclick="removePendingImage()" style="display:none;">ลบรูป</button>
          <input type="file" id="fImageFile" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
        </div>
      </div>
    </div>
    <div class="field"><label>ชื่อสินค้า</label><input id="fName" placeholder="เช่น กระดาษ A4 80 แกรม"></div>
    <div class="field-row">
      <div class="field"><label>รหัสสินค้า (SKU)</label><input id="fSku" placeholder="เช่น PPR-A4-80" class="mono"></div>
      <div class="field"><label>หน่วยนับ</label><input id="fUnit" placeholder="เช่น รีม, ชิ้น, กล่อง"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>จำนวนคงเหลือเริ่มต้น</label><input id="fQty" type="number" min="0" value="0"></div>
      <div class="field"><label>จุดสั่งซื้อขั้นต่ำ</label><input id="fMin" type="number" min="0" value="5"></div>
    </div>
    <div class="field"><label>ต้นทุนต่อหน่วย (บาท)</label><input id="fCost" type="number" min="0" step="0.01" value="0"></div>
    <div class="field"><label>กลุ่มสินค้า</label>
      <select id="fCategory">
        <option value="Hoymiles">Hoymiles</option>
        <option value="Huawei">Huawei</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeItemModal()">ยกเลิก</button>
      <button class="primary" onclick="saveItem()">บันทึกสินค้า</button>
    </div>
  </div>
</div>

<div class="modal-wrap" id="txModalWrap">
  <div class="modal" style="max-width:480px;">
    <h3 id="txModalTitle">บันทึกรับเข้า / จ่ายออก</h3>
    <div class="type-toggle">
      <button class="sel-in" id="btnTypeIn" onclick="setTxType('in')">รับเข้า (IN)</button>
      <button class="sel-out" id="btnTypeOut" onclick="setTxType('out')">จ่ายออก (OUT)</button>
    </div>

    <!-- โหมดแก้ไข: สินค้าเดียว ล็อกไม่ให้เปลี่ยนสินค้า/จำนวน -->
    <div id="txEditSingleWrap" style="display:none;">
      <div class="field"><label>สินค้า</label><select id="txItem"></select></div>
      <div class="field"><label>จำนวน</label><input id="txQty" type="number" min="1" value="1"></div>
      <div class="note" id="txEditNote" style="margin-top:-4px;margin-bottom:12px;">แก้ไขได้เฉพาะวันที่ หมายเหตุ และข้อมูลลูกค้า/Serial เท่านั้น — เปลี่ยนสินค้า จำนวน หรือประเภทรายการไม่ได้ (ถ้ากรอกผิดสินค้า/จำนวน ให้ลบรายการเดิมแล้วบันทึกใหม่แทน)</div>
      <div id="txEditOutFields" style="display:none;">
        <div class="field">
          <label>ระยะเวลารับประกัน (นับจากวันที่ขาย)</label>
          <select id="txWarrantyYears"></select>
        </div>
        <div class="field">
          <label>เลข Serial Number (กรอกทีละบรรทัด ให้ครบตามจำนวนที่ขาย)</label>
          <textarea id="txSerials" rows="3" class="mono" placeholder="เช่น&#10;HM-2024-0001&#10;HM-2024-0002"></textarea>
        </div>
      </div>
    </div>

    <!-- โหมดเพิ่มใหม่: ใส่ได้หลายสินค้าในการบันทึกครั้งเดียว -->
    <div id="txAddLinesWrap">
      <div id="txLineList"></div>
      <button type="button" class="ghost small" onclick="addTxLine()" style="margin-bottom:14px;">+ เพิ่มสินค้าอีกรายการ</button>
    </div>

    <div class="field"><label>วันที่</label><input id="txDate" type="date"></div>
    <div id="txSharedOutFields" style="display:none;">
      <div class="field-row">
        <div class="field"><label>ชื่อลูกค้า (ไม่บังคับ)</label><input id="txCustomer" placeholder="เช่น บริษัท เอบีซี จำกัด / คุณสมชาย"></div>
        <div class="field"><label>จังหวัด (ไม่บังคับ)</label><select id="txProvince"><option value="">- ไม่ระบุ -</option></select></div>
      </div>
    </div>
    <div class="field"><label>หมายเหตุ (ไม่บังคับ ใช้ร่วมกันทุกรายการในการบันทึกครั้งนี้)</label><input id="txNote" placeholder="เช่น รับจากซัพพลายเออร์ A / คำสั่งซื้อของลูกค้า"></div>

    <div class="modal-actions">
      <button class="ghost" onclick="closeTxModal()">ยกเลิก</button>
      <button class="primary" id="txSaveBtn" onclick="saveTx()">บันทึกรายการ</button>
    </div>
  </div>
</div>

<div class="modal-wrap" id="serialModalWrap">
  <div class="modal">
    <h3>แก้ไขข้อมูลประกัน / Serial</h3>
    <input type="hidden" id="serialEditId">
    <div class="field">
      <label>สินค้า</label>
      <select id="serialItem" onchange="toggleSerialFreeName()">
        <option value="">- ไม่ผูกกับสินค้าในสต็อก (ประวัติเก่าเท่านั้น) -</option>
      </select>
    </div>
    <div id="serialFreeNameWrap" style="display:none;">
      <div class="field-row">
        <div class="field"><label>ชื่อสินค้า (พิมพ์เอง)</label><input id="serialFreeName" placeholder="เช่น Hoymiles HM-1500"></div>
        <div class="field"><label>แบรนด์</label>
          <select id="serialFreeBrand"><option value="Hoymiles">Hoymiles</option><option value="Huawei">Huawei</option></select>
        </div>
      </div>
    </div>
    <div class="field"><label>Serial Number</label><input id="serialNumber" class="mono"></div>
    <div class="field-row">
      <div class="field"><label>วันที่ขาย</label><input id="serialSaleDate" type="date"></div>
      <div class="field"><label>ระยะเวลารับประกัน</label><select id="serialWarrantyYears"></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>ชื่อลูกค้า (ไม่บังคับ)</label><input id="serialCustomer" placeholder="เช่น บริษัท เอบีซี จำกัด / คุณสมชาย"></div>
      <div class="field"><label>จังหวัด (ไม่บังคับ)</label><select id="serialProvince"><option value="">- ไม่ระบุ -</option></select></div>
    </div>
    <div class="field"><label>หมายเหตุ (ไม่บังคับ)</label><input id="serialNote"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeSerialModal()">ยกเลิก</button>
      <button class="primary" onclick="saveSerialEdit()">บันทึกการแก้ไข</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('th-TH', {day:'2-digit', month:'short', year:'2-digit'});
}
function addYears(dateStr, years){
  const dt = new Date(dateStr+'T00:00:00');
  dt.setFullYear(dt.getFullYear()+years);
  return dt.toISOString().slice(0,10);
}
function warrantyStatus(expiry){
  const today = todayStr();
  const days = Math.round((new Date(expiry+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
  if(days < 0) return {label:'หมดประกันแล้ว', cls:'warr-expired'};
  if(days <= 60) return {label:'ใกล้หมดประกัน', cls:'warr-soon'};
  return {label:'ในประกัน', cls:'warr-active'};
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function toggleUnlock(){
  if(unlocked){
    unlocked = false;
    render();
    showToast('กลับเป็นโหมดดูอย่างเดียวแล้ว');
    return;
  }
  const pin = prompt('กรอกรหัสเพื่อเปิดโหมดแก้ไข');
  if(pin===null) return;
  if(pin===EDIT_PIN){
    unlocked = true;
    render();
    showToast('เปิดโหมดแก้ไขแล้ว');
  }else{
    showToast('รหัสไม่ถูกต้อง');
  }
}

async function loadData(){
  try{
    onSnapshot(dataDocRef, (snap)=>{
      if(snap.exists()){
        const remote = snap.data();
        DATA = {
          items: Array.isArray(remote.items) ? remote.items : [],
          transactions: Array.isArray(remote.transactions) ? remote.transactions : [],
          serials: Array.isArray(remote.serials) ? remote.serials : []
        };
      }else{
        DATA = { items: [], transactions: [], serials: [] };
      }
      firstSnapshotReceived = true;
      render();
    }, (err)=>{
      console.error(err);
      showToast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต/การตั้งค่า Firebase');
      if(!firstSnapshotReceived){ DATA = { items: [], transactions: [], serials: [] }; render(); }
    });
  }catch(e){
    console.error(e);
    DATA = { items: [], transactions: [], serials: [] };
    render();
  }
}
async function persist(){
  try{
    await setDoc(dataDocRef, DATA);
  }catch(e){
    console.error(e);
    showToast('บันทึกข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
  }
}

      <div style="display:flex;align-items:center;gap:8px;">

        <button class="ghost small" style="${unlocked?'border-color:var(--stamp-green);color:var(--stamp-green);':''}" onclick="toggleUnlock()">${unlocked?'🔓 โหมดแก้ไข (แตะเพื่อล็อก)':'🔒 ดูอย่างเดียว (แตะเพื่อแก้ไข)'}</button>

function renderPanel(){

  else if(currentTab==='history') host.innerHTML = historyHTML();

  else host.innerHTML = notifyHTML();

function lowStockItems(){
  return DATA.items.filter(i => i.qty <= i.minStock);
}
function txInRange(days){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days); cutoff.setHours(0,0,0,0);
  return DATA.transactions.filter(t => new Date(t.date+'T00:00:00') >= cutoff);
}

function fmtBaht(n){
  return '฿' + Number(n||0).toLocaleString('th-TH', {minimumFractionDigits:0, maximumFractionDigits:0});
}
function stockValue(items){
  return items.reduce((s,i)=> s + (i.qty * (i.cost||0)), 0);
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'inventory-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('ดาวน์โหลดไฟล์สำรองแล้ว');
}
async function handleImportBackup(evt){
  const fileInput = evt.target;
  if(!unlocked){ showToast('เปิดโหมดแก้ไขก่อนเพื่อกู้คืนข้อมูล'); fileInput.value=''; return; }
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || !Array.isArray(parsed.items)){
      alert('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลที่ถูกต้อง (ต้องเป็นไฟล์ .json ที่ดาวน์โหลดจากปุ่ม "ดาวน์โหลดไฟล์สำรอง")');
      fileInput.value=''; return;
    }
    const itemCount = parsed.items.length;
    const txCount = Array.isArray(parsed.transactions) ? parsed.transactions.length : 0;
    const serialCount = Array.isArray(parsed.serials) ? parsed.serials.length : 0;
    if(!confirm('การกู้คืนจะเขียนทับข้อมูลปัจจุบันทั้งหมดในแอปนี้ด้วยข้อมูลจากไฟล์ (สินค้า ' + itemCount + ' รายการ, ประวัติ ' + txCount + ' รายการ, Serial ' + serialCount + ' รายการ) ต้องการดำเนินการต่อหรือไม่?')){
      fileInput.value=''; return;
    }
    DATA = {
      items: Array.isArray(parsed.items) ? parsed.items : [],
      transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
      serials: Array.isArray(parsed.serials) ? parsed.serials : []
    };
    await persist();
    render();
    showToast('กู้คืนข้อมูลสำเร็จ');
  }catch(e){
    alert('ไม่สามารถอ่านไฟล์นี้ได้ กรุณาตรวจสอบว่าเป็นไฟล์ JSON ที่ถูกต้อง');
  }
  fileInput.value='';
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('โหลดตัวช่วยส่งออก Excel ไม่สำเร็จ ลองเช็คอินเทอร์เน็ตแล้วรีเฟรชหน้าใหม่');
    return;
  }
  const itemsRows = DATA.items.map(i=>({
    'ชื่อสินค้า': i.name, 'SKU': i.sku||'', 'แบรนด์': i.category||'Hoymiles',
    'คงเหลือ': i.qty, 'หน่วย': i.unit, 'จุดสั่งซื้อขั้นต่ำ': i.minStock,
    'ต้นทุนต่อหน่วย': i.cost||0, 'มูลค่าสต็อก': i.qty*(i.cost||0)
  }));
  const txRows = [...DATA.transactions].sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id)).map(t=>{
    const item = DATA.items.find(i=>i.id===t.itemId);
    return {
      'วันที่': t.date, 'สินค้า': item?item.name:'(ลบแล้ว)', 'แบรนด์': item?(item.category||'Hoymiles'):'-',
      'ประเภท': t.type==='in'?'รับเข้า':'จ่ายออก', 'จำนวน': t.qty, 'หมายเหตุ': t.note||''
    };
  });
  const serialRows = [...DATA.serials].sort((a,b)=>(b.saleDate+b.id).localeCompare(a.saleDate+a.id)).map(s=>{
    const item = s.itemId ? DATA.items.find(i=>i.id===s.itemId) : null;
    const st = warrantyStatus(s.warrantyExpiry);
    return {
      'Serial Number': s.serial, 'สินค้า': item?item.name:(s.itemName||'-'), 'แบรนด์': item?(item.category||'Hoymiles'):(s.brand||'-'),
      'ลูกค้า': s.customer||'', 'จังหวัด': s.province||'', 'วันที่ขาย': s.saleDate,
      'ระยะประกัน (ปี)': s.warrantyYears, 'วันหมดประกัน': s.warrantyExpiry, 'สถานะ': st.label, 'หมายเหตุ': s.note||''
    };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(itemsRows), 'สินค้า');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(txRows), 'ประวัติเข้า-ออก');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(serialRows), 'ประกัน-Serial');
  XLSX.writeFile(wb, 'inventory-export-' + todayStr() + '.xlsx');
  showToast('ส่งออกไฟล์ Excel แล้ว');
}

function attachHistoryFilters(){
  const ft = document.getElementById('filterType');
  const fg = document.getElementById('filterGroup');
  const fi = document.getElementById('filterItem');
  const draw = ()=>{
    const type = ft.value, group = fg.value, itemId = fi.value;
    let rows = [...DATA.transactions].sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
    if(type!=='all') rows = rows.filter(t=>t.type===type);

function parseCSVLine(line){
  const result = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQuotes){
      if(c === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
      }else{ cur += c; }
    }else{
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ result.push(cur); cur = ''; }
      else{ cur += c; }
    }
  }
  result.push(cur);
  return result;
}
function parseCSV(text){
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim()!=='');
  if(lines.length<2) return {headers:[], rows:[]};
  const headers = parseCSVLine(lines[0]).map(h=>h.trim().toLowerCase().replace(/^\uFEFF/,''));
  const rows = lines.slice(1).map(l=>{
    const cells = parseCSVLine(l);
    const obj = {};
    headers.forEach((h,idx)=>{ obj[h] = (cells[idx]||'').trim(); });
    return obj;
  });
  return {headers, rows};
}
function downloadCsvTemplate(){
  const csv = '\uFEFFserial,item_name,brand,sale_date,warranty_years,customer_name,province,note\nHM-2024-0001,Hoymiles HM-1500,Hoymiles,2024-01-15,5,บริษัท เอบีซี จำกัด,เชียงใหม่,ตัวอย่างแถวข้อมูล ลบทิ้งก่อนนำเข้าจริง\n';
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'serial-import-template.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function handleImportSerials(evt){
  const fileInput = evt.target;
  if(!unlocked){ showToast('เปิดโหมดแก้ไขก่อนเพื่อนำเข้าข้อมูล'); fileInput.value=''; return; }
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const {headers, rows} = parseCSV(text);
    if(!headers.includes('serial') || !headers.includes('item_name') || !headers.includes('sale_date')){
      alert('ไฟล์ CSV ต้องมีคอลัมน์อย่างน้อย serial, item_name, sale_date (ดูตัวอย่างจากปุ่ม "ดาวน์โหลดเทมเพลต CSV")');
      fileInput.value=''; return;
    }
    let skippedDup=0, skippedInvalid=0, matchedItems=0;
    const newSerials = []; // เก็บพักไว้ก่อน ยังไม่แตะ DATA.serials จนกว่าทั้งไฟล์จะผ่านหมด
    const existingSerials = new Set(DATA.serials.map(s=>s.serial.toLowerCase()));
    rows.forEach(row=>{
      try{
        const serial = (row.serial||'').trim();
        const itemName = (row.item_name||'').trim();
        const saleDate = (row.sale_date||'').trim();
        let brand = (row.brand||'').trim();
        let years = Number(row.warranty_years) || 1;
        years = Math.min(15, Math.max(1, years));
        const note = (row.note||'').trim();
        const customer = (row.customer_name||'').trim();
        const province = (row.province||'').trim();
        const isRealDate = /^\d{4}-\d{2}-\d{2}$/.test(saleDate) && !isNaN(new Date(saleDate+'T00:00:00').getTime()) && new Date(saleDate+'T00:00:00').toISOString().slice(0,10)===saleDate;
        if(!serial || !itemName || !isRealDate){ skippedInvalid++; return; }
        if(existingSerials.has(serial.toLowerCase())){ skippedDup++; return; }
        if(!GROUPS.includes(brand)) brand = '';
        // ไม่สร้างสินค้าใหม่ในสต็อก — ถ้าชื่อตรงกับสินค้าที่มีอยู่แล้วเป๊ะๆ จะลิงก์ไว้เฉยๆ เพื่อความสะดวก แต่ถ้าไม่ตรงก็แค่เก็บชื่อไว้ในประวัติ ไม่ยุ่งกับรายการสต็อก
        const matchedItem = DATA.items.find(i=> i.name.trim().toLowerCase()===itemName.toLowerCase());
        if(matchedItem) matchedItems++;
        const expiry = addYears(saleDate, years);
        newSerials.push({
          id:uid(), serial,
          itemId: matchedItem ? matchedItem.id : null,
          itemName: itemName,
          brand: brand || (matchedItem ? (matchedItem.category||'Hoymiles') : 'Hoymiles'),
          txId:null, saleDate, warrantyYears:years, warrantyExpiry:expiry, note, customer, province
        });
        existingSerials.add(serial.toLowerCase());
      }catch(rowErr){
        skippedInvalid++; // แถวนี้มีปัญหา ข้ามไปเฉยๆ ไม่ทำให้ทั้งไฟล์ล้ม
      }
    });
    if(newSerials.length>0){
      DATA.serials.push(...newSerials);
      await persist();
      render();
    }
    let msg = `นำเข้าสำเร็จ ${newSerials.length} รายการ (เป็นประวัติเก็บไว้เฉยๆ ไม่ได้เพิ่มลงรายการสต็อกสินค้า)`;
    if(matchedItems) msg += `\nในจำนวนนี้ ${matchedItems} รายการ ชื่อสินค้าตรงกับที่มีในสต็อกอยู่แล้ว จึงลิงก์ไว้ให้อัตโนมัติ`;
    if(skippedDup) msg += `\nข้าม (Serial ซ้ำ) ${skippedDup} รายการ`;
    if(skippedInvalid) msg += `\nข้าม (ข้อมูลไม่ครบ/วันที่ไม่ถูกต้อง เช่น รูปแบบผิดหรือวันที่ไม่มีจริง) ${skippedInvalid} รายการ`;
    alert(msg);
  }catch(e){
    console.error(e);
    alert('ไม่สามารถอ่านไฟล์นี้ได้ กรุณาตรวจสอบว่าเป็นไฟล์ CSV ที่ถูกต้อง (ไม่มีข้อมูลใดถูกบันทึกจากรอบนี้)');
  }
  fileInput.value='';
}

    lines.push('สินค้าที่ต้องสั่งซื้อเพิ่ม (' + low.length + ' รายการ):');
    GROUPS.forEach(g=>{
      const gLow = low.filter(i=>(i.category||'Hoymiles')===g);
      if(gLow.length===0) return;
      lines.push('');
      lines.push('[' + g + ']');
      gLow.forEach(i=> lines.push('- ' + i.name + ': เหลือ ' + i.qty + ' ' + i.unit + ' (ขั้นต่ำ ' + i.minStock + ')'));
    });
  }
  return lines.join('\n');
}
function copyReport(){
  const text = document.getElementById('reportBox').innerText;
  navigator.clipboard.writeText(text).then(()=> showToast('คัดลอกข้อความแล้ว')).catch(()=> showToast('คัดลอกไม่สำเร็จ'));
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function readAndCompressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 480;
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else{ if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      };
      img.onerror = ()=> reject(new Error('อ่านรูปไม่สำเร็จ'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
}
async function handleImageSelect(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('กรุณาเลือกไฟล์รูปภาพ'); return; }
  const preview = document.getElementById('fImagePreview');
  preview.innerHTML = 'กำลังประมวลผล…';
  try{
    const dataUrl = await readAndCompressImage(file);
    pendingImageDataUrl = dataUrl;
    pendingImageRemoved = false;
    preview.innerHTML = `<img src="${dataUrl}" alt="">`;
    document.getElementById('fImageRemoveBtn').style.display = 'inline-block';
  }catch(e){
    preview.innerHTML = 'ไม่มีรูป';
    showToast('ไม่สามารถอ่านไฟล์รูปนี้ได้');
  }
}
function removePendingImage(){
  pendingImageDataUrl = null;
  pendingImageRemoved = true;
  document.getElementById('fImageFile').value = '';
  document.getElementById('fImagePreview').innerHTML = 'ไม่มีรูป';

}

async function saveItem(){
  const name = document.getElementById('fName').value.trim();
  if(!name){ showToast('กรุณากรอกชื่อสินค้า'); return; }
  let id = document.getElementById('itemEditId').value;
  const qty = Number(document.getElementById('fQty').value)||0;
  const minStock = Number(document.getElementById('fMin').value)||0;
  const cost = Number(document.getElementById('fCost').value)||0;
  const sku = document.getElementById('fSku').value.trim();
  const unit = document.getElementById('fUnit').value.trim() || 'ชิ้น';
  const category = document.getElementById('fCategory').value.trim();
  let item;
  if(id){
    item = DATA.items.find(x=>x.id===id);
    Object.assign(item, {name, sku, unit, qty, minStock, cost, category});
  }else{
    id = uid();
    item = {id, name, sku, unit, qty, minStock, cost, category};
    DATA.items.push(item);
  }
  if(pendingImageDataUrl){
    item.image = pendingImageDataUrl;
  }else if(pendingImageRemoved){
    delete item.image;
  }
  await persist();
  closeItemModal();
  render();
  showToast('บันทึกสินค้าแล้ว');
}
async function deleteItem(id){
  if(!unlocked){ showToast('เปิดโหมดแก้ไขก่อนเพื่อลบข้อมูล'); return; }
  if(!confirm('ลบสินค้านี้และประวัติที่เกี่ยวข้องหรือไม่?')) return;
  DATA.items = DATA.items.filter(i=>i.id!==id);
  DATA.transactions = DATA.transactions.filter(t=>t.itemId!==id);
  await persist();
  render();
  showToast('ลบสินค้าแล้ว');
}

    <div class="tx-line-num">รายการที่ ${document.querySelectorAll('.tx-line').length+1}</div>
    <div class="field-row">
      <div class="field"><label>สินค้า</label><select class="txLineItem">${txLineItemOptions()}</select></div>
      <div class="field" style="max-width:100px;"><label>จำนวน</label><input class="txLineQty" type="number" min="1" value="1"></div>
    </div>
    <div class="txLineOutFields" style="display:${currentTxType==='out'?'block':'none'};">
      <div class="field"><label>ระยะเวลารับประกัน</label><select class="txLineWarranty">${txLineWarrantyOptions()}</select></div>
      <div class="field"><label>Serial Number (บรรทัดละ 1 เลข ให้ครบตามจำนวน)</label><textarea class="txLineSerials" rows="2" class="mono" placeholder="เช่น&#10;HM-2024-0001"></textarea></div>

function removeTxLine(lineId){

function renumberTxLines(){

function setTxType(t){
  currentTxType = t;
  document.getElementById('btnTypeIn').classList.toggle('selected', t==='in');
  document.getElementById('btnTypeOut').classList.toggle('selected', t==='out');
  document.querySelectorAll('.txLineOutFields').forEach(el=>{ el.style.display = t==='out' ? 'block' : 'none'; });
  document.getElementById('txSharedOutFields').style.display = t==='out' ? 'block' : 'none';
  const editOutFields = document.getElementById('txEditOutFields');
  if(editOutFields) editOutFields.style.display = (t==='out' && editingTxId) ? 'block' : 'none';
}
async function saveTx(){
  const date = document.getElementById('txDate').value || todayStr();
  const sharedNote = document.getElementById('txNote').value.trim();

  if(editingTxId){
    const itemId = document.getElementById('txItem').value;
    const qty = Number(document.getElementById('txQty').value);
    if(!qty || qty<=0){ showToast('กรุณากรอกจำนวนให้ถูกต้อง'); return; }
    const item = DATA.items.find(i=>i.id===itemId);
    if(!item) return;
    const tx = DATA.transactions.find(t=>t.id===editingTxId);
    if(!tx){ closeTxModal(); return; }
    let serials = [];
    let warrantyYears = null;
    let customer = '', province = '';
    if(tx.type==='out'){
      customer = document.getElementById('txCustomer').value.trim();
      province = document.getElementById('txProvince').value;
      warrantyYears = Number(document.getElementById('txWarrantyYears').value) || 1;
      const raw = document.getElementById('txSerials').value;
      serials = raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
      if(serials.length>0 && serials.length!==tx.qty){
        showToast('จำนวน Serial Number (' + serials.length + ') ไม่ตรงกับจำนวนเดิมของรายการนี้ (' + tx.qty + ')');
        return;
      }
      if(serials.length===0){
        if(!confirm('จะไม่มี Serial Number ผูกกับรายการนี้เลย ต้องการดำเนินการต่อหรือไม่?')) return;
      }
    }
    tx.date = date;
    tx.note = sharedNote;
    if(tx.type==='out'){
      DATA.serials = DATA.serials.filter(s=>s.txId!==tx.id);
      const expiry = addYears(date, warrantyYears);
      serials.forEach(sn=>{
        DATA.serials.push({id:uid(), serial:sn, itemId:tx.itemId, txId:tx.id, saleDate:date, warrantyYears, warrantyExpiry:expiry, note:sharedNote, customer, province});
      });
    }
    await persist();
    closeTxModal();
    render();
    showToast('แก้ไขรายการแล้ว');
    return;
  }

  // ---- โหมดเพิ่มใหม่: รองรับหลายสินค้าในการบันทึกครั้งเดียว ----
  const lineEls = Array.from(document.querySelectorAll('.tx-line'));
  if(lineEls.length===0){ showToast('กรุณาเพิ่มอย่างน้อย 1 รายการสินค้า'); return; }
  const customer = document.getElementById('txCustomer').value.trim();
  const province = document.getElementById('txProvince').value;

  // ตรวจสอบทุกบรรทัดให้ผ่านหมดก่อน ค่อยบันทึกจริง กันข้อมูลครึ่งๆ กลางๆ ถ้ามีบรรทัดใดผิดพลาด
  const parsedLines = [];
  for(const lineEl of lineEls){
    const itemId = lineEl.querySelector('.txLineItem').value;
    const qty = Number(lineEl.querySelector('.txLineQty').value);
    const item = DATA.items.find(i=>i.id===itemId);
    if(!item){ showToast('พบรายการสินค้าที่ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง'); return; }
    if(!qty || qty<=0){ showToast('กรุณากรอกจำนวนให้ถูกต้องทุกรายการ (' + item.name + ')'); return; }
    let serials = [];
    let warrantyYears = null;
    if(currentTxType==='out'){
      if(qty > item.qty){
        if(!confirm('จำนวนที่จ่ายออกของ "' + item.name + '" มากกว่าที่มีในสต็อก (' + item.qty + ' ' + item.unit + ') ต้องการดำเนินการต่อหรือไม่?')) return;
      }
      warrantyYears = Number(lineEl.querySelector('.txLineWarranty').value) || 1;
      const raw = lineEl.querySelector('.txLineSerials').value;
      serials = raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
      if(serials.length>0 && serials.length!==qty){
        showToast('จำนวน Serial Number ของ "' + item.name + '" (' + serials.length + ') ไม่ตรงกับจำนวนที่ขาย (' + qty + ')');
        return;
      }
      if(serials.length===0){
        if(!confirm('รายการ "' + item.name + '" ยังไม่ได้กรอก Serial Number จะไม่สามารถติดตามการรับประกันได้ ต้องการบันทึกต่อโดยไม่ระบุ Serial หรือไม่?')) return;
      }
    }
    parsedLines.push({item, qty, serials, warrantyYears});
  }

  // เช็ค Serial ซ้ำกันเองภายในชุดที่กำลังบันทึก และซ้ำกับที่มีอยู่แล้วในระบบ
  const allSerialsThisBatch = parsedLines.flatMap(l=>l.serials.map(s=>s.toLowerCase()));
  const seen = new Set();
  for(const s of allSerialsThisBatch){
    if(seen.has(s)){ showToast('มีเลข Serial "' + s + '" ซ้ำกันเองภายในรายการที่กำลังบันทึก กรุณาตรวจสอบ'); return; }
    seen.add(s);
  }
  const existingSerials = new Set(DATA.serials.map(s=>s.serial.toLowerCase()));
  for(const s of allSerialsThisBatch){
    if(existingSerials.has(s)){ showToast('เลข Serial "' + s + '" มีอยู่ในระบบแล้ว กรุณาตรวจสอบ'); return; }
  }

  const batchId = uid();
  parsedLines.forEach(({item, qty, serials, warrantyYears})=>{
    const txId = uid();
    item.qty += currentTxType==='in' ? qty : -qty;
    DATA.transactions.push({id:txId, itemId:item.id, type:currentTxType, qty, date, note:sharedNote, batchId});
    if(currentTxType==='out' && serials.length>0){
      const expiry = addYears(date, warrantyYears);
      serials.forEach(sn=>{
        DATA.serials.push({id:uid(), serial:sn, itemId:item.id, txId, saleDate:date, warrantyYears, warrantyExpiry:expiry, note:sharedNote, customer, province});
      });
    }
  });
  await persist();
  closeTxModal();
  render();
  const n = parsedLines.length;
  showToast(currentTxType==='in' ? `บันทึกรับเข้าแล้ว ${n} รายการสินค้า` : `บันทึกจ่ายออกแล้ว ${n} รายการสินค้า`);
}
